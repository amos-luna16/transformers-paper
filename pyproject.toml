[project]
name = "transformer-nmt"
version = "0.1.0"
description = "Encoder-decoder Transformer (Vaswani et al., 2017) for English-French translation, trained on Modal GPUs with MLflow tracking."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Amos Luna" }]
dependencies = [
    "torch>=2.9",
    "numpy>=2.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "mlflow>=3.4",
    "sacrebleu>=2.5",
    "matplotlib>=3.10",
    "tqdm>=4.67",
    "psutil>=7.0",
    "nvidia-ml-py>=12.0; sys_platform == 'linux'",
    "modal>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transformer_nmt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "ANN", "D"]
ignore = ["D100", "D104", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
